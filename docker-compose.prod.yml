# 本番用: 80/443 のみ公開し Nginx を入口にする想定
# Postgres / Backend / Frontend は localhost バインドのみ。Adminer は含めない。
#
# 起動: docker compose -f docker-compose.prod.yml build --no-cache
#       docker compose -f docker-compose.prod.yml up -d
#
# .env に NEXT_PUBLIC_API_URL=https://your-domain.com を設定すること（末尾 /api は不要）

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsa}
      POSTGRES_USER: ${POSTGRES_USER:-dsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dsa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsa_user} -d ${POSTGRES_DB:-dsa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-base:
    build:
      context: ./python
      dockerfile: Dockerfile
    volumes:
      - ./python:/app
      - python-cache:/root/.cache
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - STORAGE_DIR=/app/storage
      - PYTHON_PATH=python3
      - PYTHON_DIR=/app/python
      - MAX_CONCURRENT=2
      - DATABASE_URL=${DATABASE_URL}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
    volumes:
      - ./backend/storage:/app/storage
      - ./python:/app/python
    depends_on:
      python-base:
        condition: service_started
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - dsa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ビルド時に埋め込まれる（NEXT_PUBLIC_* は実行時では変更されない）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://your-domain.com}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - dsa-network

volumes:
  python-cache:
  postgres-data:

networks:
  dsa-network:
    driver: bridge
